name: Build and Release

on:
  push:
    tags:
      - 'v*'  # Triggers on version tags like v1.0.0, v2024.12.03
  workflow_dispatch:  # Allows manual trigger from GitHub UI

permissions:
  contents: write  # Required to create releases

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            target: universal-apple-darwin
            rustup_targets: aarch64-apple-darwin,x86_64-apple-darwin
            name: macOS
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            rustup_targets: x86_64-unknown-linux-gnu
            name: Linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            rustup_targets: x86_64-pc-windows-msvc
            name: Windows

    runs-on: ${{ matrix.platform }}
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Linux dependencies
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf

      # macOS signing setup
      - name: Import signing certificate (macOS)
        if: matrix.platform == 'macos-latest'
        env:
          CERTIFICATE_P12: ${{ secrets.CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
        run: |
          # Skip if no certificate is configured
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "No signing certificate configured, skipping..."
            exit 0
          fi
          
          # Create temporary keychain
          KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain-db
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)
          
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Import certificate
          echo "$CERTIFICATE_P12" | base64 --decode > $RUNNER_TEMP/certificate.p12
          security import $RUNNER_TEMP/certificate.p12 \
            -P "$CERTIFICATE_PASSWORD" \
            -A \
            -t cert \
            -f pkcs12 \
            -k "$KEYCHAIN_PATH"
          
          # Allow codesign to access the keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          
          # Add to keychain search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain
          
          # Clean up certificate file
          rm $RUNNER_TEMP/certificate.p12

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Get pnpm store directory
        shell: bash
        run: |
          echo "STORE_PATH=$(pnpm store path --silent)" >> $GITHUB_ENV

      - name: Setup pnpm cache
        uses: actions/cache@v4
        with:
          path: ${{ env.STORE_PATH }}
          key: ${{ runner.os }}-pnpm-store-${{ hashFiles('**/pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-store-

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rustup_targets }}

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Update version from tag
        shell: bash
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          
          # Convert pre-release versions to MSI-compatible format
          # Pre-releases MUST sort BEFORE their target stable version
          # Strategy: Decrement minor (or major) and encode pre-release info in patch
          # e.g., 2.0.0-beta.5 → 1.999.205 (less than 2.0.0)
          # e.g., 2.1.0-beta.5 → 2.0.205 (less than 2.1.0)
          if [[ "$TAG_VERSION" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)-(alpha|beta|rc)\.([0-9]+)$ ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            TYPE="${BASH_REMATCH[4]}"
            NUM="${BASH_REMATCH[5]}"
            
            # Type codes: alpha=1, beta=2, rc=3 (ensures alpha < beta < rc ordering)
            case "$TYPE" in
              alpha) TYPE_CODE=1 ;;
              beta)  TYPE_CODE=2 ;;
              rc)    TYPE_CODE=3 ;;
            esac
            
            # Encode patch, type, and pre-release number into a single value
            # Formula: patch*500 + type*100 + N (allows patch 0-99, N 0-99, within MSI limit 65535)
            ENCODED=$((PATCH * 500 + TYPE_CODE * 100 + NUM))
            
            # Decrement minor (or major if minor is 0) to ensure pre-release < stable
            if [ "$MINOR" -gt 0 ]; then
              VERSION="${MAJOR}.$((MINOR - 1)).${ENCODED}"
            elif [ "$MAJOR" -gt 0 ]; then
              VERSION="$((MAJOR - 1)).999.${ENCODED}"
            else
              # Edge case: 0.0.Z-type.N - cannot create version lower than 0.0.0
              echo "::warning::Pre-release of 0.0.X cannot be encoded lower than 0.0.0 stable"
              VERSION="0.0.${ENCODED}"
            fi
          else
            VERSION="$TAG_VERSION"
          fi
          
          echo "Tag version: $TAG_VERSION"
          echo "Build version: $VERSION"
          
          if command -v jq &> /dev/null; then
            jq --arg v "$VERSION" '.version = $v' src-tauri/tauri.conf.json > tmp.json && mv tmp.json src-tauri/tauri.conf.json
          else
            sed -i.bak "s/\"version\": \"[^\"]*\"/\"version\": \"$VERSION\"/" src-tauri/tauri.conf.json
            rm -f src-tauri/tauri.conf.json.bak
          fi
          
          grep '"version"' src-tauri/tauri.conf.json

      - name: Build Tauri app
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # macOS signing
          APPLE_SIGNING_IDENTITY: ${{ secrets.DEVELOPER_ID }}
          APPLE_TEAM_ID: ${{ secrets.TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APP_PASSWORD }}
          # Updater signing
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'Bored ${{ github.ref_name }}'
          releaseBody: 'See the assets to download this version and install.'
          releaseDraft: false
          # NOTE: Always false, even for beta/RC releases. Tauri's updater fetches from
          # GitHub's "latest release" endpoint, which only returns non-prerelease releases.
          # If set to true, the updater would not find beta/RC versions.
          prerelease: false
          # Disabled: We handle updater JSON merging in a separate job to avoid race conditions
          # when parallel builds each try to upload their own latest.json
          includeUpdaterJson: false
          args: --target ${{ matrix.target }}

      # Generate platform-specific updater JSON (tauri-action doesn't write it locally)
      - name: Generate updater JSON
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          REPO="${{ github.repository }}"
          PUB_DATE=$(date -u +"%Y-%m-%dT%H:%M:%SZ")
          BUNDLE_DIR="src-tauri/target/${{ matrix.target }}/release/bundle"
          
          # Debug: Show what files exist in bundle directory
          echo "=== Bundle directory contents ==="
          find "$BUNDLE_DIR" -type f -name "*.sig" -o -name "*.tar.gz" -o -name "*.zip" 2>/dev/null || echo "Bundle dir not found or empty"
          echo "================================="
          
          # Platform-specific configuration
          case "${{ matrix.name }}" in
            macOS)
              # Universal binary covers both architectures
              # Look for .tar.gz.sig in macos subdirectory
              SIG_FILE=$(find "$BUNDLE_DIR" -type f -name "*.tar.gz.sig" 2>/dev/null | head -1)
              TAR_FILE=$(find "$BUNDLE_DIR" -type f -name "*.tar.gz" ! -name "*.sig" 2>/dev/null | head -1)
              
              if [ -z "$SIG_FILE" ] || [ -z "$TAR_FILE" ]; then
                echo "ERROR: Could not find signature or tar.gz files for macOS"
                echo "SIG_FILE: $SIG_FILE"
                echo "TAR_FILE: $TAR_FILE"
                exit 1
              fi
              
              TAR_NAME=$(basename "$TAR_FILE")
              SIGNATURE=$(cat "$SIG_FILE")
              URL="https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}/${TAR_NAME}"
              # Create JSON with both darwin architectures pointing to universal binary
              jq -n \
                --arg version "$VERSION" \
                --arg notes "See the assets to download this version and install." \
                --arg pub_date "$PUB_DATE" \
                --arg sig "$SIGNATURE" \
                --arg url "$URL" \
                '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"darwin-aarch64": {signature: $sig, url: $url}, "darwin-x86_64": {signature: $sig, url: $url}}}' > latest.json
              ;;
            Linux)
              SIG_FILE=$(find "$BUNDLE_DIR" -type f -name "*.AppImage.tar.gz.sig" 2>/dev/null | head -1)
              TAR_FILE=$(find "$BUNDLE_DIR" -type f -name "*.AppImage.tar.gz" ! -name "*.sig" 2>/dev/null | head -1)
              
              if [ -z "$SIG_FILE" ] || [ -z "$TAR_FILE" ]; then
                echo "ERROR: Could not find signature or tar.gz files for Linux"
                echo "SIG_FILE: $SIG_FILE"
                echo "TAR_FILE: $TAR_FILE"
                exit 1
              fi
              
              TAR_NAME=$(basename "$TAR_FILE")
              SIGNATURE=$(cat "$SIG_FILE")
              URL="https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}/${TAR_NAME}"
              jq -n \
                --arg version "$VERSION" \
                --arg notes "See the assets to download this version and install." \
                --arg pub_date "$PUB_DATE" \
                --arg sig "$SIGNATURE" \
                --arg url "$URL" \
                '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"linux-x86_64": {signature: $sig, url: $url}}}' > latest.json
              ;;
            Windows)
              # Prefer NSIS installer for updates
              SIG_FILE=$(find "$BUNDLE_DIR" -type f -name "*-setup.nsis.zip.sig" 2>/dev/null | head -1)
              ZIP_FILE=$(find "$BUNDLE_DIR" -type f -name "*-setup.nsis.zip" ! -name "*.sig" 2>/dev/null | head -1)
              
              if [ -z "$SIG_FILE" ] || [ -z "$ZIP_FILE" ]; then
                echo "ERROR: Could not find signature or zip files for Windows"
                echo "SIG_FILE: $SIG_FILE"
                echo "ZIP_FILE: $ZIP_FILE"
                exit 1
              fi
              
              ZIP_NAME=$(basename "$ZIP_FILE")
              SIGNATURE=$(cat "$SIG_FILE")
              URL="https://github.com/${REPO}/releases/download/${GITHUB_REF_NAME}/${ZIP_NAME}"
              jq -n \
                --arg version "$VERSION" \
                --arg notes "See the assets to download this version and install." \
                --arg pub_date "$PUB_DATE" \
                --arg sig "$SIGNATURE" \
                --arg url "$URL" \
                '{version: $version, notes: $notes, pub_date: $pub_date, platforms: {"windows-x86_64": {signature: $sig, url: $url}}}' > latest.json
              ;;
          esac
          
          echo "Generated latest.json:"
          cat latest.json

      - name: Upload updater JSON artifact
        if: startsWith(github.ref, 'refs/tags/')
        uses: actions/upload-artifact@v4
        with:
          name: updater-json-${{ matrix.name }}
          path: latest.json
          if-no-files-found: error

      - name: Get version from tag
        id: version
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT
          else
            echo "version=dev-$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT
          fi

      - name: Upload artifacts (macOS)
        if: matrix.platform == 'macos-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Bored-${{ steps.version.outputs.version }}-macOS
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app
          if-no-files-found: warn

      - name: Upload artifacts (Linux)
        if: matrix.platform == 'ubuntu-22.04'
        uses: actions/upload-artifact@v4
        with:
          name: Bored-${{ steps.version.outputs.version }}-Linux
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb
          if-no-files-found: warn

      - name: Upload artifacts (Windows)
        if: matrix.platform == 'windows-latest'
        uses: actions/upload-artifact@v4
        with:
          name: Bored-${{ steps.version.outputs.version }}-Windows
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
          if-no-files-found: warn

      # Cleanup keychain (macOS only)
      - name: Cleanup keychain
        if: always() && matrix.platform == 'macos-latest'
        run: |
          security delete-keychain $RUNNER_TEMP/signing.keychain-db || true

  # Merge platform-specific updater JSONs into a single file
  merge-updater-json:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download all updater JSON artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: updater-json-*
          path: updater-artifacts
          merge-multiple: false

      - name: Merge updater JSONs
        run: |
          # Find all latest.json files from artifacts
          echo "Found updater JSON files:"
          find updater-artifacts -name "latest.json" -type f
          
          # Count found files and fail if none exist
          FILE_COUNT=$(find updater-artifacts -name "latest.json" -type f | wc -l)
          if [ "$FILE_COUNT" -eq 0 ]; then
            echo "ERROR: No latest.json files found in artifacts. Cannot create valid updater manifest."
            exit 1
          fi
          echo "Found $FILE_COUNT updater JSON file(s)"
          
          # Start with empty platforms object
          MERGED='{"platforms":{}}'
          
          # Use null-terminated strings to safely handle filenames with spaces/special chars
          while IFS= read -r -d '' json_file; do
            echo "Processing: $json_file"
            cat "$json_file"
            echo ""
            
            # Extract version, notes, pub_date from first file (should be same across all)
            if [ "$(echo "$MERGED" | jq -r '.version // empty')" = "" ]; then
              VERSION=$(jq -r '.version' "$json_file")
              NOTES=$(jq -r '.notes // ""' "$json_file")
              PUB_DATE=$(jq -r '.pub_date // ""' "$json_file")
              MERGED=$(echo "$MERGED" | jq --arg v "$VERSION" --arg n "$NOTES" --arg p "$PUB_DATE" \
                '. + {version: $v, notes: $n, pub_date: $p}')
            fi
            
            # Merge platforms from this file into the combined object
            MERGED=$(echo "$MERGED" | jq --slurpfile new "$json_file" \
              '.platforms += ($new[0].platforms // {})')
          done < <(find updater-artifacts -name "latest.json" -type f -print0)
          
          echo "Merged latest.json:"
          echo "$MERGED" | jq .
          
          # Validate the merged JSON has required fields
          if [ "$(echo "$MERGED" | jq -r '.version // empty')" = "" ]; then
            echo "ERROR: Merged JSON is missing required 'version' field"
            exit 1
          fi
          
          # Write merged file
          echo "$MERGED" | jq . > latest.json

      - name: Upload merged updater JSON to release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Uploading merged latest.json to release ${{ github.ref_name }}"
          gh release upload "${{ github.ref_name }}" latest.json --clobber --repo ${{ github.repository }}

  # Cleanup old releases after all builds complete
  cleanup:
    needs: [build, merge-updater-json]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cleanup old releases
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Keep the latest 5 releases, delete older ones
          KEEP_COUNT=5
          
          # Get all releases sorted by date (newest first), skip the first N
          gh release list --limit 100 --json tagName,createdAt \
            --jq ".[${KEEP_COUNT}:] | .[].tagName" | while read -r tag; do
            if [ -n "$tag" ]; then
              echo "Deleting old release: $tag"
              gh release delete "$tag" --yes --cleanup-tag || true
            fi
          done
